spring:
  application:
    name: ask-backend
  datasource:
    url: ${ASK_DB_URL:jdbc:postgresql://localhost:5432/ask}
    username: ${ASK_DB_USERNAME:ask}
    password: ${ASK_DB_PASSWORD:ask}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${ASK_MAIL_HOST:smtp.gmail.com}
    port: ${ASK_MAIL_PORT:587}
    username: ${ASK_MAIL_USERNAME:}
    password: ${ASK_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${ASK_SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

auth:
  challenge:
    ttl: ${AUTH_CHALLENGE_TTL:300}
    code-length: ${AUTH_CHALLENGE_CODE_LENGTH:6}
    max-attempts: ${AUTH_CHALLENGE_MAX_ATTEMPTS:5}
  customer:
    session:
      ttl: ${AUTH_CUSTOMER_SESSION_TTL:86400}
    remembered-session:
      ttl: ${AUTH_CUSTOMER_REMEMBERED_SESSION_TTL:2592000}
  business:
    session:
      ttl: ${AUTH_BUSINESS_SESSION_TTL:86400}
    remembered-session:
      ttl: ${AUTH_BUSINESS_REMEMBERED_SESSION_TTL:2592000}
  verification:
    email:
      enabled: ${AUTH_VERIFICATION_EMAIL_ENABLED:true}
    sms:
      enabled: ${AUTH_VERIFICATION_SMS_ENABLED:false}
  jwt:
    secret: ${AUTH_JWT_SECRET:change-me-in-production-use-at-least-256-bits}
  email:
    from: ${AUTH_EMAIL_FROM:noreply@ask.kz}
