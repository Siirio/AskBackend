spring:
  application:
    name: ask-backend
  datasource:
    url: ${ASK_DB_URL:jdbc:postgresql://localhost:5432/ask}
    username: ${ASK_DB_USERNAME:ask}
    password: ${ASK_DB_PASSWORD:ask}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${ASK_SERVER_PORT:8080}
