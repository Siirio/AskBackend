spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ask
    username: postgres
    password: admin
  jpa:
    show-sql: true
  mail:
    username: local-test@example.com
    password: local-test-password

server:
  port: 2020

management:
  health:
    mail:
      enabled: false

auth:
  jwt:
    secret: local-development-secret-key-at-least-256-bits-long
  verification:
    email:
      enabled: false
    sms:
      enabled: false
    staging-bypass: true

ask:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
  ai:
    search:
      api-key: ${DEEPSEEK_API_KEY:}
    autodump:
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_AUTODUMP_MODEL:deepseek-v4-flash}
      max-tokens: ${DEEPSEEK_AUTODUMP_MAX_TOKENS:4000}

springdoc:
  swagger-ui:
    enabled: true
