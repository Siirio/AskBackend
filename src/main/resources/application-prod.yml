spring:
  datasource:
    url: ${ASK_DB_URL}
    username: ${ASK_DB_USERNAME}
    password: ${ASK_DB_PASSWORD}

server:
  port: ${ASK_SERVER_PORT:8080}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
  staff:
    temp-password-key: ${AUTH_STAFF_TEMP_PASSWORD_KEY}
  verification:
    test-mode: ${AUTH_VERIFICATION_TEST_MODE:false}
    staging-bypass: ${AUTH_VERIFICATION_STAGING_BYPASS:false}
  oauth2:
    google:
      client-id: ${OAUTH2_GOOGLE_CLIENT_ID:}
      client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET:}
    frontend-redirect-uri: ${OAUTH2_FRONTEND_REDIRECT_URI:https://ask.com.kz/oauth/callback}

ask:
  cors:
    allowed-origins: ${ASK_CORS_ORIGINS:https://ask.com.kz,https://stage.ask.com.kz,https://ask-frontend-stage-ask7.vercel.app}
  contact:
    hmac-secret: ${ASK_CONTACT_HMAC_SECRET}
    encryption-key: ${ASK_CONTACT_ENCRYPTION_KEY}
    action-token-ttl: ${ASK_CONTACT_ACTION_TOKEN_TTL:30m}

management:
  endpoints:
    web:
      exposure:
        include: health
