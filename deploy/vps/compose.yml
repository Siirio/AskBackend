x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-healthcheck: &app-healthcheck
  test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
  interval: 10s
  timeout: 5s
  retries: 10

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - app-prod
      - app-stage
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ask

  db-prod:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ask_prod
      POSTGRES_USER: ask_prod
      POSTGRES_PASSWORD: ${ASK_PROD_DB_PASSWORD:?ASK_PROD_DB_PASSWORD must be set}
    volumes:
      - pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ask_prod -d ask_prod"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ask

  db-stage:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ask_stage
      POSTGRES_USER: ask_stage
      POSTGRES_PASSWORD: ${ASK_STAGE_DB_PASSWORD:?ASK_STAGE_DB_PASSWORD must be set}
    volumes:
      - pg_stage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ask_stage -d ask_stage"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ask

  meili-prod:
    image: getmeili/meilisearch:v1.10.3
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_PROD_MASTER_KEY:?MEILI_PROD_MASTER_KEY must be set}
    logging: *default-logging
    volumes:
      - meili_prod:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7700/health | grep -q available"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ask

  meili-stage:
    image: getmeili/meilisearch:v1.10.3
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_STAGE_MASTER_KEY:?MEILI_STAGE_MASTER_KEY must be set}
    logging: *default-logging
    volumes:
      - meili_stage:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7700/health | grep -q available"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ask

  app-prod:
    image: ask-backend:${BUILD_PROD_SHA:?BUILD_PROD_SHA must be set}
    build:
      context: ../..
      dockerfile: Dockerfile.runtime
      args:
        APP_JAR: ask-prod-app.jar
    restart: unless-stopped
    logging: *default-logging
    healthcheck: *app-healthcheck
    depends_on:
      db-prod:
        condition: service_healthy
      meili-prod:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      BUILD_SHA: ${BUILD_PROD_SHA:?BUILD_PROD_SHA must be set}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      ASK_DB_URL: jdbc:postgresql://db-prod:5432/ask_prod
      ASK_DB_USERNAME: ask_prod
      ASK_DB_PASSWORD: ${ASK_PROD_DB_PASSWORD:?ASK_PROD_DB_PASSWORD must be set}
      ASK_SERVER_PORT: 8080
      AUTH_JWT_SECRET: ${AUTH_PROD_JWT_SECRET:?AUTH_PROD_JWT_SECRET must be set}
      AUTH_STAFF_TEMP_PASSWORD_KEY: ${AUTH_PROD_STAFF_TEMP_PASSWORD_KEY:?AUTH_PROD_STAFF_TEMP_PASSWORD_KEY must be set}
      ASK_CONTACT_HMAC_SECRET: ${ASK_CONTACT_HMAC_SECRET:?ASK_CONTACT_HMAC_SECRET must be set}
      ASK_CONTACT_ENCRYPTION_KEY: ${ASK_CONTACT_ENCRYPTION_KEY:?ASK_CONTACT_ENCRYPTION_KEY must be set}
      AUTH_VERIFICATION_TEST_MODE: "false"
      AUTH_VERIFICATION_STAGING_BYPASS: "false"
      OAUTH2_GOOGLE_CLIENT_ID: ${OAUTH2_PROD_GOOGLE_CLIENT_ID:-}
      OAUTH2_GOOGLE_CLIENT_SECRET: ${OAUTH2_PROD_GOOGLE_CLIENT_SECRET:-}
      OAUTH2_FRONTEND_REDIRECT_URI: https://ask.com.kz/oauth/callback
      ASK_MAIL_HOST: ${ASK_MAIL_HOST:-smtp.resend.com}
      ASK_MAIL_PORT: ${ASK_MAIL_PORT:-587}
      ASK_MAIL_USERNAME: ${ASK_MAIL_USERNAME:-resend}
      ASK_MAIL_PASSWORD: ${ASK_MAIL_PASSWORD:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-noreply@ask.com.kz}
      ASK_CORS_ORIGINS: https://ask.com.kz,https://ask-frontend-stage-ask7.vercel.app
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_SEARCH_MODEL: ${DEEPSEEK_SEARCH_MODEL:-deepseek-v4-flash}
      DEEPSEEK_SEARCH_MAX_TOKENS: ${DEEPSEEK_SEARCH_MAX_TOKENS:-1800}
      DEEPSEEK_AUTODUMP_MODEL: ${DEEPSEEK_AUTODUMP_MODEL:-deepseek-v4-flash}
      DEEPSEEK_AUTODUMP_MAX_TOKENS: ${DEEPSEEK_AUTODUMP_MAX_TOKENS:-4000}
      MEILISEARCH_HOST_URL: http://meili-prod:7700
      MEILISEARCH_API_KEY: ${MEILI_PROD_MASTER_KEY:?MEILI_PROD_MASTER_KEY must be set}
      MEILISEARCH_INDEX_NAME: ${MEILISEARCH_PROD_INDEX_NAME:-search_documents_v1}
      ASK_BUSINESS_MEDIA_UPLOAD_DIR: /var/lib/ask/business-media
    volumes:
      - business_media_prod:/var/lib/ask/business-media
    networks:
      - ask

  app-stage:
    image: ask-backend:${BUILD_STAGE_SHA:?BUILD_STAGE_SHA must be set}
    build:
      context: ../..
      dockerfile: Dockerfile.runtime
      args:
        APP_JAR: ask-stage-app.jar
    restart: unless-stopped
    logging: *default-logging
    healthcheck: *app-healthcheck
    depends_on:
      db-stage:
        condition: service_healthy
      meili-stage:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      BUILD_SHA: ${BUILD_STAGE_SHA:?BUILD_STAGE_SHA must be set}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      ASK_DB_URL: jdbc:postgresql://db-stage:5432/ask_stage
      ASK_DB_USERNAME: ask_stage
      ASK_DB_PASSWORD: ${ASK_STAGE_DB_PASSWORD:?ASK_STAGE_DB_PASSWORD must be set}
      ASK_SERVER_PORT: 8080
      AUTH_JWT_SECRET: ${AUTH_STAGE_JWT_SECRET:?AUTH_STAGE_JWT_SECRET must be set}
      AUTH_STAFF_TEMP_PASSWORD_KEY: ${AUTH_STAGE_STAFF_TEMP_PASSWORD_KEY:?AUTH_STAGE_STAFF_TEMP_PASSWORD_KEY must be set}
      ASK_CONTACT_HMAC_SECRET: ${ASK_CONTACT_HMAC_SECRET:?ASK_CONTACT_HMAC_SECRET must be set}
      ASK_CONTACT_ENCRYPTION_KEY: ${ASK_CONTACT_ENCRYPTION_KEY:?ASK_CONTACT_ENCRYPTION_KEY must be set}
      AUTH_VERIFICATION_TEST_MODE: "true"
      AUTH_VERIFICATION_STAGING_BYPASS: "true"
      OAUTH2_GOOGLE_CLIENT_ID: ${OAUTH2_STAGE_GOOGLE_CLIENT_ID:-}
      OAUTH2_GOOGLE_CLIENT_SECRET: ${OAUTH2_STAGE_GOOGLE_CLIENT_SECRET:-}
      OAUTH2_FRONTEND_REDIRECT_URI: https://stage.ask.com.kz/oauth/callback
      ASK_MAIL_HOST: ${ASK_MAIL_HOST:-smtp.resend.com}
      ASK_MAIL_PORT: ${ASK_MAIL_PORT:-587}
      ASK_MAIL_USERNAME: ${ASK_MAIL_USERNAME:-resend}
      ASK_MAIL_PASSWORD: ${ASK_MAIL_PASSWORD:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-noreply@ask.com.kz}
      ASK_CORS_ORIGINS: https://stage.ask.com.kz,https://ask-frontend-stage-ask7.vercel.app
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_SEARCH_MODEL: ${DEEPSEEK_SEARCH_MODEL:-deepseek-v4-flash}
      DEEPSEEK_SEARCH_MAX_TOKENS: ${DEEPSEEK_SEARCH_MAX_TOKENS:-1800}
      DEEPSEEK_AUTODUMP_MODEL: ${DEEPSEEK_AUTODUMP_MODEL:-deepseek-v4-flash}
      DEEPSEEK_AUTODUMP_MAX_TOKENS: ${DEEPSEEK_AUTODUMP_MAX_TOKENS:-4000}
      MEILISEARCH_HOST_URL: http://meili-stage:7700
      MEILISEARCH_API_KEY: ${MEILI_STAGE_MASTER_KEY:?MEILI_STAGE_MASTER_KEY must be set}
      MEILISEARCH_INDEX_NAME: ${MEILISEARCH_STAGE_INDEX_NAME:-search_documents_v1}
      ASK_BUSINESS_MEDIA_UPLOAD_DIR: /var/lib/ask/business-media
    volumes:
      - business_media_stage:/var/lib/ask/business-media
    networks:
      - ask

volumes:
  caddy_data:
  caddy_config:
  pg_prod:
  pg_stage:
  meili_prod:
  meili_stage:
  business_media_prod:
  business_media_stage:

networks:
  ask:
