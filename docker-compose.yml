services:
  postgres:
    image: postgres:16
    container_name: ask-postgres
    environment:
      POSTGRES_DB: ask
      POSTGRES_USER: ask
      POSTGRES_PASSWORD: ask
    ports:
      - "5433:5432"
    volumes:
      - ask-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ask -d ask"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ask-pg-data:
