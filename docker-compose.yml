services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ASK_DB_NAME:-ask}
      POSTGRES_USER: ${ASK_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${ASK_DB_PASSWORD:-admin}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ask-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ASK_DB_USERNAME:-postgres} -d ${ASK_DB_NAME:-ask}"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.10.3
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-}
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meili_data:/meili_data
    networks:
      - ask-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7700/health | grep -q available"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "${ASK_SERVER_PORT:-8080}:8080"
    environment:
      ASK_DB_URL: jdbc:postgresql://db:5432/${ASK_DB_NAME:-ask}
      ASK_DB_USERNAME: ${ASK_DB_USERNAME:-postgres}
      ASK_DB_PASSWORD: ${ASK_DB_PASSWORD:-admin}
      ASK_SERVER_PORT: "8080"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-in-production-use-at-least-256-bits}
      AUTH_CHALLENGE_TTL: ${AUTH_CHALLENGE_TTL:-300}
      AUTH_VERIFICATION_EMAIL_ENABLED: ${AUTH_VERIFICATION_EMAIL_ENABLED:-true}
      AUTH_VERIFICATION_SMS_ENABLED: ${AUTH_VERIFICATION_SMS_ENABLED:-false}
      AUTH_VERIFICATION_STAGING_BYPASS: ${AUTH_VERIFICATION_STAGING_BYPASS:-false}
      AUTH_STAFF_TEMP_PASSWORD_KEY: ${AUTH_STAFF_TEMP_PASSWORD_KEY:-local-development-temp-password-key}
      OAUTH2_GOOGLE_CLIENT_ID: ${OAUTH2_GOOGLE_CLIENT_ID:-}
      OAUTH2_GOOGLE_CLIENT_SECRET: ${OAUTH2_GOOGLE_CLIENT_SECRET:-}
      OAUTH2_FRONTEND_REDIRECT_URI: ${OAUTH2_FRONTEND_REDIRECT_URI:-http://localhost:3000/oauth/callback}
      ASK_MAIL_HOST: ${ASK_MAIL_HOST:-smtp.gmail.com}
      ASK_MAIL_PORT: ${ASK_MAIL_PORT:-587}
      ASK_MAIL_USERNAME: ${ASK_MAIL_USERNAME:-}
      ASK_MAIL_PASSWORD: ${ASK_MAIL_PASSWORD:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-noreply@ask.kz}
      ASK_CORS_ORIGINS: ${ASK_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
      MEILISEARCH_HOST_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-}
      MEILISEARCH_INDEX_NAME: ${MEILISEARCH_INDEX_NAME:-search_documents_v1}
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - ask-network

volumes:
  pgdata:
  meili_data:

networks:
  ask-network:
